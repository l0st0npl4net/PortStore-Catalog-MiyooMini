# Builds the catalog (index.json) every day and when recipes change, and publishes it
# on GitHub Pages: Settings > Pages > Source: GitHub Actions.
name: index

on:
  schedule:
    - cron: "17 3 * * *"
  # Also started by release.yml when a Port Store release is published.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["recipes/**", "index/**", ".github/workflows/index.yml"]

# Each job gets only what it needs: the build (which reads untrusted archives) can
# write issues, not deploy; the deploy can deploy.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow makes the ports' pictures small for the device; py7zr reads 7z releases.
      - run: pip install pillow==11.3.0 py7zr==0.22.0
      - uses: actions/cache@v4
        with:
          path: .cache
          key: releases-${{ github.run_id }}
          restore-keys: releases-
      - name: Build index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.json"
          # The build keeps in .cache only the release files it used.
          python3 index/build.py --out site/index.json --cache .cache --previous "$previous"
      - name: Build homebrew.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Homebrew Hub's list, each ROM pinned to its database's commit; when Homebrew
          # Hub cannot be read, the published list is kept.
          previous="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/homebrew.json"
          python3 index/homebrew.py --out site/homebrew.json --previous "$previous" || true
      - name: Report failing recipes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 index/report.py site/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
